# Staging / production-like override:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build
# - production mode, Postgres/Redis not reachable from the host, everything restarts on failure.
# - Put real secrets (JWT_SECRET, SMTP_*, S3_*, SENTRY_DSN, TURNSTILE_SECRET_KEY,
#   TWO_FACTOR_ENCRYPTION_KEY ...) in hyrr.backend/.env; set PUBLIC_API_URL, CORS_ORIGINS,
#   FRONTEND_URL, RECRUITER_APP_URL and the VITE_* build args in the shell or the root .env.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  meilisearch:
    ports: !reset []
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      # Production mode requires a master key of at least 16 bytes.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY (16+ chars) for staging}

  backend:
    environment:
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SEED_DEMO_DATA: "false"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY (16+ chars) for staging}
      # BullMQ on Redis (the default whenever REDIS_HOST is set; explicit here).
      QUEUE_DRIVER: bullmq
    restart: unless-stopped
    # Several API replicas: not done here because the base file pins container_name and the
    # host port 3000. Behind a load balancer, drop both, then `--scale backend=2`; Redis already
    # shares rate limits, socket.io events (sticky sessions are still needed for the polling
    # transport) and queues across instances.

  worker:
    environment:
      NODE_ENV: production
      SEED_DEMO_DATA: "false"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY (16+ chars) for staging}
      QUEUE_DRIVER: bullmq
    restart: unless-stopped

  recruiter:
    restart: unless-stopped

  jobseeker:
    restart: unless-stopped

  backup:
    restart: unless-stopped

  clamav:
    restart: unless-stopped
