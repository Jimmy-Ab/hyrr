services:
  # ─── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hyrr_postgres
    environment:
      POSTGRES_USER: hyrr_user
      POSTGRES_PASSWORD: hyrr_password
      POSTGRES_DB: hyrr_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyrr_user -d hyrr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (cache for public job search / AI recommendations) ────────────────
  redis:
    image: redis:7-alpine
    container_name: hyrr_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # ─── NestJS Backend API ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./hyrr.backend
      dockerfile: Dockerfile
    container_name: hyrr_backend
    env_file:
      - ./hyrr.backend/.env
    environment:
      DATABASE_URL: postgresql://hyrr_user:hyrr_password@postgres:5432/hyrr_db?schema=public
      NODE_ENV: production
      # JWT_SECRET comes from ./hyrr.backend/.env (env_file above). The backend refuses to start
      # in production if it is missing, shorter than 32 chars, or the .env.example placeholder.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174}
      UPLOAD_DIR: /app/uploads
      # Demo data is only loaded when explicitly requested: SEED_DEMO_DATA=true docker compose up
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "npx prisma migrate deploy &&
             if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then npx prisma db seed; fi &&
             node dist/main"

  # ─── Recruiter SPA ────────────────────────────────────────────────────────────
  recruiter:
    build:
      context: .
      dockerfile: hyrr.recruiter/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3000}
    container_name: hyrr_recruiter
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # ─── Job seeker SPA ───────────────────────────────────────────────────────────
  jobseeker:
    build:
      context: .
      dockerfile: hyrr.jobseeker/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3000}
    container_name: hyrr_jobseeker
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
