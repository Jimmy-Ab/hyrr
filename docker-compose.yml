version: '3.9'

services:
  # ─── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hyrr_postgres
    environment:
      POSTGRES_USER: hyrr_user
      POSTGRES_PASSWORD: hyrr_password
      POSTGRES_DB: hyrr_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hyrr_user -d hyrr_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (for session caching / BullMQ queues if needed) ───────────────────
  redis:
    image: redis:7-alpine
    container_name: hyrr_redis
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data

  # ─── NestJS Backend API ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./hyrr.backend
      dockerfile: Dockerfile
    container_name: hyrr_backend
    env_file:
      - ./hyrr.backend/.env
    environment:
      DATABASE_URL: postgresql://hyrr_user:hyrr_password@postgres:5432/hyrr_db?schema=public
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main"

volumes:
  postgres_data:
  redis_data:
